# Defaults for comfy-agent. Every value here can be overridden per run
# from the CLI flags or the WebUI controls.

comfyui:
  url: http://10.0.0.15:8188
  workflow: workflows/anima_flow.json
  timeout_s: 600          # max wait for one generation
  poll_interval_s: 2

llm:
  # Who writes the prompts: openrouter | ollama (WebUI dropdown / CLI --provider override per run).
  provider: openrouter

openrouter:
  base_url: https://openrouter.ai/api/v1
  default_model: ""       # empty = choose each run (CLI prompts, WebUI dropdown)
  temperature: 0.8

ollama:
  url: http://10.0.0.15:11434
  default_model: ""       # empty = choose each run
  temperature: 0.8
  think: false            # thinking models reason first when true (much slower)
  timeout_s: 600          # includes loading the model into VRAM

judge:
  model: jev-latest
  max_attempts: 5
  # Each dimension is normalized to 0..1; all must reach their threshold to pass.
  thresholds:
    fidelity: 0.67
    format: 0.67
    completeness: 0.67
    negative: 0.67

prompt:
  # Default prompt body style (WebUI radio / CLI --style override per run):
  #   natural = English sentences, which Anima understands; tags = danbooru tags.
  # The prefix, negative_base and rating tags below are added as tags in both styles.
  style: natural
  # Always prepended to the generated positive prompt (quality tags, LoRA triggers...).
  positive_prefix: "masterpiece, best quality, score_7, score_8, score_9, year 2025, year 2026"
  # Always merged into the generated negative prompt.
  negative_base: "worst quality, low quality, score_1, score_2, score_3, score_4, score_5, score_6, artist name, blurry, jpeg artifacts, chromatic aberration, bad anatomy, bad hands, censored, mosaic censoring"
  # Content rating chosen per run (WebUI radio / CLI --rating); unset = add nothing.
  # Tags here are forced in. In tag style they are also removed from the opposite side if the
  # model wrote them there; in natural style the writer and Jev are told the rating instead.
  ratings:
    sfw:
      positive: "safe"
      negative: "nsfw, explicit, nude, nipples, pussy, penis, sex"
    nsfw:
      positive: "nsfw, explicit"
      negative: ""

generation:
  width: 832
  height: 1216
  batch_size: 1
  seed: -1                # -1 = random each run
  steps: 35
  cfg: 5.5
  sampler_name: er_sde
  scheduler: beta
  denoise: 0.9            # img2img only; txt2img always uses 1.0
  filename_prefix: comfy_agent
  # LoRA strengths keyed by lora_name; unlisted LoRAs keep the workflow value.
  lora_strengths: {}

runs_dir: runs

ui:
  language: en            # en | zh-TW; default language of the WebUI and HTML reports
