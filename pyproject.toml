[project]
name = "comfy-agent"
version = "0.1.0"
description = "Idea -> OpenRouter prompt -> Jev judge -> ComfyUI automation"
authors = [
    { name = "JeffreyLeeTW", email = "a31185367@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.28.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
comfy-agent = "comfy_agent.cli:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
